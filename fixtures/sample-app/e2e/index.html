<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample app</title>
  </head>
  <body>
    <button id="save" type="button">Save</button>
    <p id="status"></p>
    <script>
      document.getElementById('save').addEventListener('click', () => {
        document.getElementById('status').textContent = 'Saved';
      });
    </script>
  </body>
</html>
